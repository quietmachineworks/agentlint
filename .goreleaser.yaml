version: 2

builds:
  - main: ./cmd/agentlint
    binary: agentlint
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# The release notes are the changelog section for the tag, passed to
# --release-notes by the workflow. Disabling the changelog here empties the
# release body instead of leaving that file to fill it.
