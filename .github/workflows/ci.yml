name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Path handling is the whole job here: a config tree is read by
        # absolute path, and symlinked skill folders behave differently on
        # Windows than they do anywhere else.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: gofmt leaves nothing to say
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  # Every action here is GitHub's own: this organization allows only those and
  # verified creators, and a workflow naming any other fails before it starts.
  # A linter that ships as a Go module needs no action at all.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every version here is pinned, the analysers included. An analyser reads
      # the compiler's export data, so it has to be built for the same Go the
      # rest of this workflow uses: newer on either side and it cannot decode
      # what it is given.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
