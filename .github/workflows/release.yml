name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # goreleaser compiles this module rather than shipping with it, so it runs
      # on current Go while go.mod keeps its own floor. Every recent release of
      # it requires more than that floor.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: The release notes are the changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "CHANGELOG.md carries no section for $version"; exit 1; }
          cat "$RUNNER_TEMP/release-notes.md"
      - name: Build and publish the binaries
        run: go run github.com/goreleaser/goreleaser/v2@v2.15.4 release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
