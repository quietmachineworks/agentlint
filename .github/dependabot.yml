# Two things go stale here: the schema library and the actions the workflows
# pin by major tag. Nothing else in the tree has a version.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Raise"
    ignore:
      # x/text 0.40 and up require Go 1.26, and a tool people install with one
      # command should not demand the newest toolchain. Lift this when the
      # module's own floor moves.
      - dependency-name: golang.org/x/text
        versions: [">=0.40.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "Raise"
